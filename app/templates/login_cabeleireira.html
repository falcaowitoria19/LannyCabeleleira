
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acesso da Cabeleireira</title>

    <link rel="stylesheet" href="{% static 'css/login_cabeleleira.css' %}">
</head>

<body>

    <main class="login-container">

        <h1>Lanny Cabeleleira</h1>
        <p>Área exclusiva da cabeleireira</p>

        <form method="POST">
            {% csrf_token %}

            {% if erro %}
                <p class="erro">{{ erro }}</p>
            {% endif %}

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    name="senha"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">Entrar</button>

        </form>

    </main>

</body>
</html>
